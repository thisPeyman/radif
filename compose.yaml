services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: insta_helper
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insta_helper"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
